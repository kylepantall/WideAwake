ShortDescription: Keeps your PC awake while plugged in, with a Lights out mode that darkens the screen and keyboard while staying reachable.
Description: |-
  WideAwake is a small tray app that stops Windows sleeping while the PC is on AC power, so it stays reachable over SSH, Remote Desktop or Tailscale.
  Its Lights out mode (Ctrl+Alt+L) blacks out the screen, dims brightness, turns off the keyboard backlight on ASUS laptops and ignores key presses, without triggering Modern Standby. Hold Esc for 3 seconds to exit.
